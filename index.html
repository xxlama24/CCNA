<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>CCNA Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout concept: night-time network ops room. Bottom tab bar, one focus card at a time,
   pastel signals (pink, blue, orange, green) on near-black. Questions are shown as the original screenshots. */
:root{
  --bg:#fff5f9; --surface:#ffffff; --surface2:#eaf5ff; --line:#f0d6e2;
  --fg:#1b1633; --muted:#6c6590; --accent:#ff6fa8; --accent-ink:#c2185b;
  --blue:#7fc4fb; --blue-ink:#1766a8; --orange:#ff8a2b; --orange-ink:#b85300;
  --green:#22c07a; --green-ink:#0f7a4a; --lav:#b9a7ff; --lav-ink:#5a41c9; --sun:#ffd24d; --sun-ink:#8a6400;
  --danger:#ff6a4d; --shadow:0 8px 24px rgba(120,60,100,.12);
  --f-d:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif; --f-b:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif; --f-m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0a14; --surface:#15142a; --surface2:#1d1b38; --line:#2d2a52;
    --fg:#f6f1ff; --muted:#aaa4cc; --accent:#ffb3d1; --accent-ink:#ffb3d1;
    --blue:#a8d8ff; --blue-ink:#a8d8ff; --orange:#ff9a4d; --orange-ink:#ffb27a;
    --green:#5be3a0; --green-ink:#5be3a0; --lav:#c7b8ff; --lav-ink:#c7b8ff; --sun:#ffe08a; --sun-ink:#ffe08a;
    --danger:#ff7a5c; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0a14; --surface:#15142a; --surface2:#1d1b38; --line:#2d2a52;
  --fg:#f6f1ff; --muted:#aaa4cc; --accent:#ffb3d1; --accent-ink:#ffb3d1;
  --blue:#a8d8ff; --blue-ink:#a8d8ff; --orange:#ff9a4d; --orange-ink:#ffb27a;
  --green:#5be3a0; --green-ink:#5be3a0; --lav:#c7b8ff; --lav-ink:#c7b8ff; --sun:#ffe08a; --sun-ink:#ffe08a;
  --danger:#ff7a5c; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-ink)}
.wrap{max-width:860px;margin:0 auto}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.mono{font-family:var(--f-m)}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:1.35rem}h3{font-size:1.1rem}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{height:14px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 0 8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.brand{font-family:var(--f-d);font-weight:800;font-size:1.15rem;letter-spacing:.2px}
.brand b{color:var(--accent-ink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:.85rem;font-weight:700;white-space:nowrap}
.pill.fire{background:color-mix(in srgb,var(--orange) 18%,var(--surface));border-color:color-mix(in srgb,var(--orange) 45%,var(--line));color:var(--orange-ink)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.05rem}
.icon-btn:focus-visible,.btn:focus-visible,.opt:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.xp{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.xp>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--orange));border-radius:99px;transition:width .5s}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card + .card,.stack > * + *{margin-top:14px}
.hero{position:relative;overflow:hidden;border:0;color:#fff;background:linear-gradient(135deg,#1c1840 0%,#2b2468 55%,#4b2a78 100%)}
:root[data-theme="light"] .hero,:root:not([data-theme="dark"]) .hero{}
.hero h2{color:#fff}
.hero .count{font-family:var(--f-d);font-weight:800;font-size:4rem;line-height:1;color:var(--sun)}
.hero .sub{color:#e6defc}
.hero .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.hero .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--accent));border-radius:99px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-family:var(--f-b);background:var(--accent);color:#2a0a1b;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.blue{background:var(--blue);color:#0b2540;box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 55%,#000)}
.btn.green{background:var(--green);color:#052b1a;box-shadow:0 4px 0 color-mix(in srgb,var(--green) 55%,#000)}
.btn.orange{background:var(--orange);color:#2c1300;box-shadow:0 4px 0 color-mix(in srgb,var(--orange) 55%,#000)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:8px 12px;font-size:.9rem;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700;border:1px solid var(--line);background:var(--surface2);color:var(--fg)}
button.chip:hover{border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.d1{--dc:var(--blue)}.d2{--dc:var(--accent)}.d3{--dc:var(--orange)}.d4{--dc:var(--green)}.d5{--dc:var(--lav)}.d6{--dc:var(--sun)}
.dchip{border-color:color-mix(in srgb,var(--dc) 60%,var(--line));background:color-mix(in srgb,var(--dc) 16%,var(--surface))}
.dchip i{width:9px;height:9px;border-radius:50%;background:var(--dc);display:inline-block}
/* grid */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:700px){.g3d{grid-template-columns:repeat(3,minmax(0,1fr))}.g4d{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:6px;text-align:start;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);min-width:0;box-shadow:var(--shadow)}
.tile .em{font-size:1.5rem}
.tile b{font-family:var(--f-d);font-size:1.02rem}
.tile small{color:var(--muted);line-height:1.35}
button.tile:hover{border-color:var(--accent)}
/* tab bar */
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{border:0;background:transparent;border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.72rem;font-weight:800;color:var(--muted)}
.tab span{font-size:1.25rem;line-height:1.2}
.tab[aria-current="page"]{background:color-mix(in srgb,var(--accent) 20%,var(--surface));color:var(--fg)}
/* domain bars */
.dbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:9px 0}
.track{height:12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;position:relative}
.track>i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--dc,var(--accent));border-radius:99px;transition:width .5s}
.track>i.seen{opacity:.35}
/* session */
.sess-top{display:flex;gap:10px;align-items:center;margin:12px 0 8px}
.prog{height:12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--accent));transition:width .35s}
.qcard{padding:12px}
.imgbox{direction:ltr;overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff;-webkit-overflow-scrolling:touch}
.imgbox img{display:block;height:auto;max-width:none;cursor:zoom-in;background:#fff}
.imgbox + .imgbox{margin-top:8px}
.zoombar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0 2px;color:var(--muted);font-size:.85rem}
.opts{display:grid;gap:10px;margin-top:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;font-weight:800;text-align:start;transition:transform .08s,border-color .15s,background .15s}
.opt .L{width:36px;height:36px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-m);font-weight:700;direction:ltr}
.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 20%,var(--surface))}
.opt[aria-pressed="true"] .L{background:var(--blue);color:#0b2540}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 22%,var(--surface))}
.opt.right .L{background:var(--green);color:#052b1a}
.opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 18%,var(--surface))}
.opt.wrong .L{background:var(--danger);color:#2b0900}
.opts.lockd .opt{pointer-events:none}
.optrow{display:flex;flex-wrap:wrap;gap:10px}
.optrow .opt{flex:1 1 120px;justify-content:center}
.fb{margin-top:14px;border-radius:18px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;animation:pop .35s ease both}
.fb.ok{background:color-mix(in srgb,var(--green) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--green) 55%,var(--line))}
.fb.no{background:color-mix(in srgb,var(--orange) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--orange) 55%,var(--line))}
.fb .mascot{width:84px}
.fb p{margin:0;font-weight:800;font-size:1.05rem}
@keyframes pop{from{transform:scale(.92) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.combo{font-family:var(--f-d);font-weight:800;color:var(--orange-ink)}
.sheet-bg{position:fixed;inset:0;background:rgba(5,4,15,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:84vh;overflow:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.term-line{margin:8px 0;padding:10px 12px;border-radius:14px;background:var(--surface2)}
.term-line b{font-family:var(--f-d)}
.trick{background:color-mix(in srgb,var(--sun) 24%,var(--surface));border:1px dashed color-mix(in srgb,var(--sun) 70%,var(--line));border-radius:14px;padding:10px 12px;font-weight:700}
/* flash card */
.flip{margin:14px 0;cursor:pointer}
.face{border-radius:24px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px;border:1px solid var(--line);box-shadow:var(--shadow);min-height:300px;animation:pop .35s ease both}
.face.front{background:linear-gradient(160deg,var(--surface),color-mix(in srgb,var(--dc) 22%,var(--surface)));align-items:center;text-align:center}
.face.front .term{font-family:var(--f-m);font-weight:700;font-size:clamp(1.5rem,6vw,2.3rem);direction:ltr}
.face.back{background:var(--surface);text-align:start;display:none;justify-content:flex-start}
.face.back .en{direction:ltr;text-align:left}
.flip.on .front{display:none}
.flip.on .back{display:flex}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* mock list */
.mock{display:flex;gap:12px;align-items:center}
.mock .n{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:1.2rem;background:var(--surface2)}
.mock.done .n{background:var(--green);color:#052b1a}
/* plan */
.phase{position:relative;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.phase.now{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.phase.past{opacity:.7}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal i{aspect-ratio:1;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-style:normal;font-size:.72rem;color:var(--muted);border:1px solid var(--line)}
.cal i.on{background:var(--green);color:#052b1a;border-color:transparent;font-weight:800}
.cal i.today{outline:2px solid var(--accent)}
.task{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface2);margin:8px 0}
.task .ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;flex:none}
.task.done .ck{background:var(--green);border-color:var(--green);color:#052b1a}
.task.done{opacity:.8}
/* splash */
.splash{position:fixed;inset:0;z-index:80;overflow:auto;background:radial-gradient(1200px 600px at 80% -10%,#4b2a78 0,transparent 60%),radial-gradient(900px 500px at 0% 110%,#1d5a8a 0,transparent 55%),#0b0a14;color:#fff;
  padding:max(22px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-left,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.splash .box{width:100%;max-width:560px;margin:auto;display:grid;gap:14px;text-align:center}
.ob-l{font-weight:800;color:#fff;margin-top:4px}
.splash input[type=text],.splash input[type=date]{background:#fff;color:#1b1633;border:2px solid transparent}
.splash .btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.3)}
.splash h1{font-size:clamp(1.8rem,7vw,2.6rem);color:#fff}
.splash .big{font-family:var(--f-d);font-weight:800;font-size:clamp(4rem,22vw,7rem);line-height:1;color:var(--sun)}
.splash .say{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:14px 16px;text-align:start}
.splash .say small{display:block;color:var(--blue);font-weight:800;margin-bottom:2px}
.splash .bats{display:flex;justify-content:center;gap:18px;align-items:flex-end}
.splash .bats .mascot{width:96px}
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.1;transform:scale(.6)}}
/* confetti */
.cf{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.cf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
.toast{position:fixed;inset-inline:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:70;pointer-events:none}
.toast div{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;box-shadow:var(--shadow);animation:pop .3s ease both;max-width:92%}
.lightbox{position:fixed;inset:0;z-index:75;background:rgba(5,4,15,.92);display:flex;flex-direction:column}
.lightbox .bar{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px max(12px,env(safe-area-inset-left,0px));padding-top:max(10px,env(safe-area-inset-top,0px))}
.lightbox .scroll{flex:1;overflow:auto;padding:0 8px 24px}
.lightbox img{display:block;background:#fff;border-radius:8px;height:auto}
.skeleton{height:160px;border-radius:14px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.explain{white-space:pre-wrap;line-height:1.75}
.explain-box{margin-top:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface2);padding:12px 14px}
input[type=text],input[type=date],input[type=search]{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 6px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:.78rem;font-weight:800}
.badge .e{font-size:1.7rem;filter:grayscale(1);opacity:.45}
.badge.got .e{filter:none;opacity:1}
.badge.got{border-color:var(--accent)}
.warn{border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--sun) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--sun) 60%,var(--line));font-size:.9rem}
svg text{font-family:var(--f-b)}
.mascot{display:block}

/* Select and Place (exam-like) */
.sap{direction:ltr;text-align:left;margin-top:12px;border:1px solid #8b93a7;border-radius:6px;background:#fff;color:#1b1633;overflow:hidden;box-shadow:var(--shadow)}
.sap-title{display:flex;justify-content:space-between;padding:6px 10px;font-size:.8rem;background:#f1f3f8;border-bottom:1px solid #cfd4e2;color:#333}
.sap-body{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
@media (max-width:520px){.sap-body{grid-template-columns:1fr}}
.sap-left,.sap-right{display:flex;flex-direction:column;gap:8px;min-width:0}
.sap-left{min-height:60px}
.sap-opt{background:#bfe8ff;border:1px solid #5a8aa8;padding:10px 10px;font-size:.9rem;line-height:1.35;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:#10243a;border-radius:2px}
.sap-opt.sel{outline:3px solid var(--accent);background:#d6f1ff}
.sap-opt.in{margin:0;width:100%;height:100%}
.sap-opt.ghost{position:fixed;z-index:200;opacity:.92;box-shadow:0 8px 20px rgba(0,0,0,.3);pointer-events:none;cursor:grabbing}
.sap-grp{background:#f2a66a;border:1px solid #b9743a;padding:6px;display:flex;flex-direction:column;gap:6px}
.sap-gl{font-weight:700;font-size:.9rem;color:#2a1604}
.sap-slot{min-height:44px;background:#fff1b8;border:1px solid #7b6a2a;display:flex;align-items:stretch;position:relative}
.sap-slot .num{margin:auto;color:#7b6a2a;font-weight:700}
.sap-slot.hot{outline:3px dashed var(--blue-ink);background:#fff8d6}
.sap-slot.ok{background:#bff0cf;border-color:#168a4c}.sap-slot.ok .sap-opt{background:#9fe3b8}
.sap-slot.bad{background:#ffd3c9;border-color:#c0391b}.sap-slot.bad .sap-opt{background:#ffc0b2}

function touchDay() {

function grade(k, ok) {

function plan() {

/* ================= SESSIONS ================= */
function smartPick(pool, n) {
  const due = shuffle(pool.filter(isDue)), un = pool.filter(k => !isSeen(k)), rest = shuffle(pool.filter(k => isSeen(k) && !isDue(k)));
  const out = [], take = k => { if (out.length < n && !out.includes(k)) out.push(k); };
  due.slice(0, Math.ceil(n * .3)).forEach(take);
  const g = {}; un.forEach(k => { (g[ITEMS[k].k] = g[ITEMS[k].k] || []).push(k); });
  for (const pk of shuffle(Object.keys(g))) for (const k of shuffle(g[pk])) take(k);
  due.forEach(take); rest.forEach(take);
  return out;
}
function startPrac(title, keys, extra) {
  if (!keys.length) { toast("ما فيه أسئلة هنا حالياً 🌟"); return; }
  Q = Object.assign({ mode: "prac", title, keys, i: 0, ans: {}, res: {}, combo: 0, maxCombo: 0, ok: 0, bad: 0, xp0: S.xp, tok: 0, revealed: {} }, extra || {});
  window.scrollTo(0, 0); render();
}
function startCards(title, keys) {
  if (!keys.length) { toast("ما فيه بطاقات هنا حالياً 🌟"); return; }
  Q = { mode: "cards", title, keys, i: 0, ok: 0, bad: 0, xp0: S.xp, res: {} }; window.scrollTo(0, 0); render();
}
function startMock(n) {
  const ks = META.mocks[n - 1].slice(); const g = {};
  ks.forEach(k => { (g[ITEMS[k].k] = g[ITEMS[k].k] || []).push(k); });
  const order = []; shuffle(Object.keys(g)).forEach(pk => shuffle(g[pk]).forEach(k => order.push(k)));
  Q = { mode: "exam", title: "اختبار " + AR(n), mockN: n, keys: order, i: 0, ans: {}, flags: {}, res: {}, tok: 0, t0: Date.now(), limit: order.length * 72, xp0: S.xp };
  window.scrollTo(0, 0); render();
}
function startFrom(kind, d) {
  const all = allQ();
  if (kind === "quick") return startPrac("تدريب سريع", smartPick(all, 10));
  if (kind === "daily") { const P = plan(); return startPrac("تدريب اليوم", smartPick(all, clamp(P.perDay > 0 ? Math.min(P.perDay, 20) : 15, 10, 20))); }
  if (kind === "due") return startPrac("مراجعة مستحقة", shuffle(all.filter(isDue)).slice(0, 20));
  if (kind === "mist") return startPrac("بنك الأخطاء", shuffle(all.filter(isMistake)).slice(0, 20));
  if (kind === "dd") return startPrac("سحب وإفلات", smartPick(ORDER.d, 10));
  if (kind === "sp") return startPrac("محاكاة Spoto", smartPick(ORDER.s, 10));
  if (kind === "new20") return startPrac("جديد", smartPick(all.filter(k => !isSeen(k)), 20));
  if (kind === "dom") return startPrac(AR(d) + ". " + DOM[d].ar, smartPick(all.filter(k => ITEMS[k].d === d), 15));
  const cs = Object.keys(CARDS);
  if (kind === "c8") { const un = cs.filter(k => !isSeen(k)), du = shuffle(cs.filter(isDue)); return startCards("بطاقات اليوم", du.slice(0, 4).concat(un).slice(0, 8).concat(du.slice(4)).slice(0, 8)); }
  if (kind === "cdue") return startCards("مراجعة البطاقات", shuffle(cs.filter(isDue)).slice(0, 15));
  if (kind === "call") return startCards("كل البطاقات", cs.filter(k => !isSeen(k)).concat(cs.filter(isSeen)).slice(0, 25));
  if (kind === "cmist") return startCards("اللي نسيتيها", shuffle(cs.filter(isMistake)).slice(0, 20));
  if (kind === "cdom") return startCards(AR(d) + ". " + DOM[d].ar, cs.filter(k => CARDS[k].d === d));
}
function runMission() {
  const M = mission(), t = M.tasks.find(x => x.cur < x.tgt && x.go) || M.tasks.find(x => x.go);
  if (!t) return toast("استريحي اليوم 🌙");
  if (t.go === "mock") return startMock(t.mock);
  startFrom(t.go === "cards" ? "c8" : t.go);
}

function bindExamNav() { }
function pickOpt(L) {

  let cur = (Q.ans[k] || "").split("").filter(Boolean);

function submitMCQ() {

async function boot() {

  app().innerHTML = '<div class="wrap" style="padding-top:40px;text-align:center"><div style="width:110px;margin:0 auto">' + mascot("cat", "cheer") + '</div><p>لحظة… نجهّز لك الموقع 🌸</p></div>';
  try { META = await (await fetch("data/meta.json")).json(); }
  catch (e) { app().innerHTML = '<div class="wrap" style="padding-top:40px"><div class="card">⚠️ ما قدرت أحمل بيانات الأسئلة. حدّثي الصفحة.</div></div>'; return; }
  try { DDDATA = await (await fetch("data/dd.json")).json(); } catch (e) { DDDATA = {}; }
  try { EXP = await (await fetch("data/exp.json")).json(); } catch (e) { EXP = {}; }
  buildIndex();
  if (!S.setup) showOnboarding(); else if (!S.greet || S.greet !== todayK()) { render(); showSplash(); } else render();
  initCaps();
}
async function initCaps() {
  try {
    if (!window.claude || !claude.use) return;
    const [u, db, sm] = await Promise.all([claude.use("user"), claude.use("db"), claude.use("sample")]);
    SAMPLE = sm || null;
    if (u && db) {
      UID = await u.id();
      if (UID) {
        DBREF = db.doc("data/users/" + UID + "/state");
        const snap = await DBREF.get();
